name: carepaws
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Not referenced directly: Flutter's own Cupertino widgets (search field clear
  # button, disclosure chevrons) draw from this font. Without it the release
  # build warns and those glyphs render blank on device.
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/docs/
