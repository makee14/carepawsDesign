    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#E4843E"/>
      <stop offset="1" stop-color="#D4621A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- Ic.petPair, 120x120 viewBox scaled to 600 and centred. -->
  <g transform="translate(212 212) scale(5)">
