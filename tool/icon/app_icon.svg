<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CarePaws launcher icon.
       Brand: orange gradient squircle, sitting-dog + nested-cat mark (no text).
       The mark is the app's own Ic.petPair artwork (lib/design/icons.dart),
       so the icon and the in-app logo stay in step. -->
