<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CarePaws launcher icon.
       Brand: orange gradient squircle, cream paw-with-heart mark.
       The mark is the app's own Ic.pawHeart glyph (lib/design/icons.dart),
       so the icon and the in-app logo stay in step. Bolder and larger than
       the previous paw: it fills the canvas with confidence. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#E4843E"/>
      <stop offset="1" stop-color="#D4621A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- Ic.pawHeart, 24x24 viewBox scaled up and centred. -->
  <g transform="translate(212 212) scale(25)" fill="#FEFBF4">
    <path d="M12 20.5C9.5 18.5 5.2 15.2 5.2 11.8C5.2 9.9 6.7 8.5 8.5 8.5C9.9 8.5 11.1 9.3 12 10.6C12.9 9.3 14.1 8.5 15.5 8.5C17.3 8.5 18.8 9.9 18.8 11.8C18.8 15.2 14.5 18.5 12 20.5Z"/>
    <path d="M6.5 9.8a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8Z"/>
    <path d="M17.5 9.8a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8Z"/>
    <path d="M10.3 6.8a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8Z"/>
    <path d="M13.7 6.8a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8Z"/>
  </g>
</svg>
